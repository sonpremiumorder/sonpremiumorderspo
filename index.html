<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #app-frame {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        @media (max-width: 768px) {
            html, body {
                position: fixed;
                inset: 0;
            }

            #app-frame {
                width: 100%;
                height: 100dvh;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

<iframe
    id="app-frame"
    allow="camera; microphone; geolocation">
</iframe>

<script>
(function () {
    // 1. Giải mã ẩn link Web App bằng khóa XOR (không chứa chuỗi link rõ trong code)
    const _k = [83, 79, 78, 80, 82, 69, 77, 73, 85, 77];
    const _d = [
        59, 58, 63, 62, 57, 119, 127, 126, 32, 47, 55, 62, 46, 54, 49, 124,
        59, 60, 44, 126, 61, 43, 52, 62, 36, 125, 36, 124, 127, 63, 45, 57,
        46, 54, 49, 44, 61, 125, 44, 62, 57, 61, 36, 48, 25, 19, 46, 48,
        53, 21, 7, 36, 48, 46, 19, 58, 36, 48, 62, 46, 23, 53, 55, 60,
        19, 54, 62, 32, 42, 44, 46, 20, 46, 46, 47, 45, 44, 59, 54, 22,
        42, 30, 56, 43, 38, 53, 47, 121, 56, 121, 61, 38, 60, 46, 44, 45,
        46, 57, 121, 56, 34, 49, 44, 54, 62, 36, 127, 60, 56, 43, 61, 56
    ];

    function _unlock() {
        let out = "";
        for (let i = 0; i < _d.length; i++) {
            out += String.fromCharCode(_d[i] ^ _k[i % _k.length]);
        }
        return out;
    }

    const frame = document.getElementById("app-frame");
    if (frame) {
        frame.src = _unlock();
    }

    // 2. Chặn F12, phím tắt DevTools và chuột phải trên máy tính
    const isDesktop = !window.matchMedia("(hover: none) and (pointer: coarse)").matches;

    function blockEvent(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    if (isDesktop) {
        document.addEventListener("contextmenu", blockEvent, true);

        window.addEventListener("keydown", function (e) {
            const key = (e.key || "").toUpperCase();
            const ctrlOrMeta = e.ctrlKey || e.metaKey;

            if (e.keyCode === 123 || key === "F12") {
                return blockEvent(e);
            }
            if (ctrlOrMeta && e.shiftKey && (key === "I" || key === "J" || key === "C")) {
                return blockEvent(e);
            }
            if (e.metaKey && e.altKey && (key === "I" || key === "J" || key === "C")) {
                return blockEvent(e);
            }
            if (ctrlOrMeta && (key === "U" || key === "S")) {
                return blockEvent(e);
            }
        }, true);

        const threshold = 160;
        setInterval(function () {
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            if ((widthDiff > threshold || heightDiff > threshold) && frame) {
                frame.style.display = "none";
            } else if (frame) {
                frame.style.display = "block";
            }
        }, 1000);
    }
})();
</script>

</body>
</html>
