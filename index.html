<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#ffffff">

    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont,
                         'Segoe UI', Roboto, sans-serif;
        }

        #app-mount {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #fff;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            background: #fff;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        .devtools-lock {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #111827;
            color: #ffffff;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            flex-direction: column;
            gap: 14px;
        }

        .devtools-lock.active {
            display: flex;
        }

        .devtools-lock h2 {
            font-size: 22px;
        }

        .devtools-lock p {
            max-width: 420px;
            font-size: 14px;
            line-height: 1.6;
        }

        .devtools-lock button {
            margin-top: 6px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            html, body {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
            }

            iframe {
                height: 100dvh;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

<div id="app-mount"></div>

<div id="devtools-screen" class="devtools-lock">

    <h2>⚠️ Cảnh báo bảo mật</h2>

    <p>
        Vui lòng đóng công cụ nhà phát triển (DevTools)
        trên máy tính để tiếp tục sử dụng SƠN PREMIUM ORDER.
    </p>

    <button type="button" onclick="location.reload()">
        Tải lại trang
    </button>

</div>

<script id="boot-script">
(function () {

    "use strict";

    // =====================================
    // 1. LINK GOOGLE APPS SCRIPT
    // MÃ HÓA THÀNH 3 PHẦN BASE64
    // =====================================

    const p1 = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5";

    const p2 = "Y2J5MHpJYTZXZnRXdjhydHNtY2lpMUxSeHIxeEZvRzdhUXEzRW54";

    const p3 = "aFpCYzdDUVVwTG1seGxQeDUwaXNOMlpTYXk3eHIvZXhlYw==";


    // =====================================
    // 2. KHỞI TẠO
    // =====================================

    const mount = document.getElementById("app-mount");

    const lockScreen = document.getElementById("devtools-screen");


    // =====================================
    // 3. NHẬN DIỆN THIẾT BỊ
    // =====================================

    function isMobileDevice() {

        const ua = navigator.userAgent || "";

        const isMobileUA =
            /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);

        const isCoarsePointer =
            window.matchMedia &&
            window.matchMedia("(hover: none) and (pointer: coarse)").matches;

        return isMobileUA ||
               (isCoarsePointer && window.innerWidth <= 1024);
    }


    // =====================================
    // 4. GIẢI MÃ LINK
    // =====================================

    let appURL;

    try {

        appURL = atob(p1 + p2 + p3);

    } catch (error) {

        console.error("Lỗi giải mã URL:", error);

        mount.innerHTML =
            "<p style='padding:30px;text-align:center'>Không thể khởi tạo ứng dụng. Vui lòng tải lại trang.</p>";

        return;
    }


    // =====================================
    // 5. TẠO IFRAME
    // =====================================

    const frame = document.createElement("iframe");

    frame.setAttribute(
        "allow",
        "camera; microphone; geolocation; clipboard-read; clipboard-write"
    );

    frame.setAttribute(
        "title",
        "SƠN PREMIUM ORDER"
    );

    frame.setAttribute(
        "loading",
        "eager"
    );

    frame.src = appURL;

    mount.appendChild(frame);


    // =====================================
    // 6. TỐI ƯU MÀN HÌNH
    // PC / LAPTOP / ANDROID / IPHONE
    // =====================================

    function resizeApp() {

        const height = window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;

        mount.style.height = height + "px";

        frame.style.height = height + "px";
    }

    window.addEventListener("resize", resizeApp);

    window.addEventListener("orientationchange", resizeApp);

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            resizeApp
        );
    }

    resizeApp();


    // =====================================
    // 7. BẢO VỆ DEVTOOLS TRÊN PC / LAPTOP
    // =====================================

    if (!isMobileDevice()) {

        let locked = false;

        function lockPage() {

            if (locked) return;

            locked = true;

            mount.innerHTML = "";

            if (lockScreen) {
                lockScreen.classList.add("active");
            }
        }


        // CHẶN CHUỘT PHẢI

        document.addEventListener("contextmenu", function (e) {

            e.preventDefault();

            return false;

        });


        // CHẶN PHÍM TẮT DEVTOOLS

        window.addEventListener("keydown", function (e) {

            const key = (e.key || "").toUpperCase();

            const isMac =
                navigator.platform.toUpperCase().indexOf("MAC") >= 0;

            const mod = isMac ? e.metaKey : e.ctrlKey;

            if (

                e.key === "F12" ||

                (mod && e.shiftKey &&
                    ["I", "J", "C"].includes(key)) ||

                (isMac && e.metaKey && e.altKey &&
                    ["I", "J", "C"].includes(key)) ||

                (mod && ["U", "S"].includes(key))

            ) {

                e.preventDefault();

                e.stopPropagation();

                lockPage();

                return false;
            }

        }, true);


        // PHÁT HIỆN DEVTOOLS QUA KÍCH THƯỚC CỬA SỔ

        const threshold = 160;

        setInterval(function () {

            if (

                window.outerWidth - window.innerWidth > threshold ||

                window.outerHeight - window.innerHeight > threshold

            ) {

                lockPage();
            }

        }, 800);

    }


    // =====================================
    // 8. XÓA SCRIPT KHỞI ĐỘNG
    // =====================================

    const self = document.getElementById("boot-script");

    if (self) {
        self.remove();
    }

})();
</script>

</body>
</html>
