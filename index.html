<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #app-frame {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

  
        @media (max-width: 768px) {
            html, body {
                position: fixed;
                inset: 0;
            }

            #app-frame {
                width: 100%;
                height: 100dvh;
            }
        }

    
        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

<iframe
    id="app-frame"
    allow="camera; microphone; geolocation"
    referrerpolicy="no-referrer">
</iframe>

<script>
(function () {

    const _enc = "Y2V4ZS93ZmtSMXExb1hEZE0wWEFvZ05qRVZvbllTUXVtZWpGUWtBc18xbVNoTDhRXzA4YzVuMnJ0VEkyRkxrOFdFeWJjeUZLQS9zL3NvcmNhbS9zZWxlZ29vZy9tb2MuZWxnb29nLnRwaXJjcy8vOnNwdHRo";

    function _decodeUrl(encoded) {
        const reversed = atob(encoded);
        return reversed.split("").reverse().join("");
    }

    const frame = document.getElementById("app-frame");
    if (frame) {
        frame.src = _decodeUrl(_enc);
    }

    const isDesktop = !window.matchMedia("(hover: none) and (pointer: coarse)").matches;

    function blockEvent(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    if (isDesktop) {
        document.addEventListener("contextmenu", blockEvent, true);

        window.addEventListener("keydown", function (e) {
            const key = (e.key || "").toUpperCase();
            const ctrlOrMeta = e.ctrlKey || e.metaKey;

            if (e.keyCode === 123 || key === "F12") {
                return blockEvent(e);
            }

  
            if (ctrlOrMeta && e.shiftKey && (key === "I" || key === "J" || key === "C")) {
                return blockEvent(e);
            }
            if (e.metaKey && e.altKey && (key === "I" || key === "J" || key === "C")) {
                return blockEvent(e);
            }
            if (ctrlOrMeta && key === "U") {
                return blockEvent(e);
            }

            if (ctrlOrMeta && key === "S") {
                return blockEvent(e);
            }
        }, true);

        const threshold = 160;
        setInterval(function () {
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            if ((widthDiff > threshold || heightDiff > threshold) && frame) {
                frame.style.display = "none";
            } else if (frame) {
                frame.style.display = "block";
            }
        }, 1000);
    }
})();
</script>

</body>
</html>
