<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        /* Tối ưu cho mobile */
        @media (max-width: 768px) {
            html, body {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
            }

            iframe {
                height: 100dvh;
            }
        }

        /* Ngăn zoom khi double-tap trên iOS */
        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

<iframe
src="https://script.google.com/macros/s/AKfycbyBteMSTqYNU6IGPWbCf85B5w-N4mla1OY9HpRZJQc51ScKF4NM9QO7ajKPPzcytwEiEw/exec"
allow="camera; microphone; geolocation">
</iframe>

</body>
</html>
