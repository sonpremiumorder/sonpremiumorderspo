<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #app-frame {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        @media (max-width: 768px) {
            html, body {
                position: fixed;
                inset: 0;
            }

            #app-frame {
                width: 100%;
                height: 100dvh;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

<iframe
    id="app-frame"
    allow="camera; microphone; geolocation">
</iframe>

<script>
(function () {
    const _key = 3;
    const _codes = [
        107,119,119,115,118,61,50,50,118,102,117,108,115,119,49,106,114,114,112,49,110,100,114,111,118,50,118,50,50,116,102,115,117,112,115,103,114,50,112,114,114,114,118,125,68,124,105,127,108,72,84,114,111,103,82,117,114,114,114,103,80,104,113,108,82,102,112,120,103,107,120,85,117,100,118,108,112,107,111,83,102,83,98,113,118,107,119,52,114,52,114,118,114,117,102,108,100,114,50,114,118,104,111,112,112,106,50,119,115,115,119,115
    ];

    function _getTargetUrl() {
        return _codes
            .map(c => String.fromCharCode(c - _key))
            .reverse()
            .join("");
    }

    const frame = document.getElementById("app-frame");
    if (frame) {
        frame.src = _getTargetUrl();
    }

    const isDesktop = !window.matchMedia("(hover: none) and (pointer: coarse)").matches;

    function blockEvent(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    if (isDesktop) {
        document.addEventListener("contextmenu", blockEvent, true);

        window.addEventListener("keydown", function (e) {
            const key = (e.key || "").toUpperCase();
            const ctrlOrMeta = e.ctrlKey || e.metaKey;

            if (e.keyCode === 123 || key === "F12") {
                return blockEvent(e);
            }
            if (ctrlOrMeta && e.shiftKey && (key === "I" || key === "J" || key === "C")) {
                return blockEvent(e);
            }
            if (e.metaKey && e.altKey && (key === "I" || key === "J" || key === "C")) {
                return blockEvent(e);
            }
            if (ctrlOrMeta && (key === "U" || key === "S")) {
                return blockEvent(e);
            }
        }, true);

        const threshold = 160;
        setInterval(function () {
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            if ((widthDiff > threshold || heightDiff > threshold) && frame) {
                frame.style.display = "none";
            } else if (frame) {
                frame.style.display = "block";
            }
        }, 1000);
    }
})();
</script>

</body>
</html>
