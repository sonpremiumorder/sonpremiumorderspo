
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #app-frame {
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            background: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        @supports not (height: 100dvh) {
            #app-frame {
                height: 100vh;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

<iframe
    id="app-frame"
    title="SƠN PREMIUM ORDER"
    allow="camera; microphone; geolocation"
    referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<script>
(function () {

    const _m1 = {
        key: 7,
        data: [
            97, 76, 70, 40, 116, 40, 116, 104,
            117, 100, 102, 106, 40, 106, 104,
            100, 41, 98, 107, 96, 104, 104,
            96, 41, 115, 119, 110, 117, 100,
            116, 40, 40, 61, 116, 119, 115,
            115, 111
        ]
    };

    const _m2 = {
        key: 11,
        data: [
            97, 94, 110, 126, 89, 90, 74, 120,
            84, 58, 99, 88, 127, 51, 67, 90,
            84, 59, 51, 104, 62, 101, 102, 121,
            127, 95, 66, 57, 77, 64, 51, 103,
            92, 78, 114, 105, 104, 114
        ]
    };

    const _m3 = {
        key: 13,
        data: [
            110, 104, 117, 104, 34, 122, 107,
            102, 127, 119, 92, 60, 60, 98, 85,
            105, 121, 73, 64, 61, 85, 76, 98,
            106, 92, 99, 71, 72, 91, 98, 99,
            94, 84, 92, 116, 66, 64, 107
        ]
    };

    function _giaiMaPhan(part) {
        return part.data
            .map(code => String.fromCharCode(code ^ part.key))
            .reverse()
            .join("");
    }

    const _link =
        _giaiMaPhan(_m1) +
        _giaiMaPhan(_m2) +
        _giaiMaPhan(_m3);

    const frame = document.getElementById("app-frame");

    if (frame) {
        frame.src = _link;
    }

    const isDesktop = !window.matchMedia(
        "(hover: none) and (pointer: coarse)"
    ).matches;

    function blockEvent(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    if (isDesktop) {

        document.addEventListener(
            "contextmenu",
            blockEvent,
            true
        );

        window.addEventListener("keydown", function(e) {

            const key = (e.key || "").toUpperCase();
            const ctrlOrMeta = e.ctrlKey || e.metaKey;

            if (e.keyCode === 123 || key === "F12") {
                return blockEvent(e);
            }

            if (
                ctrlOrMeta &&
                e.shiftKey &&
                ["I", "J", "C"].includes(key)
            ) {
                return blockEvent(e);
            }

            if (
                e.metaKey &&
                e.altKey &&
                ["I", "J", "C"].includes(key)
            ) {
                return blockEvent(e);
            }

            if (
                ctrlOrMeta &&
                ["U", "S"].includes(key)
            ) {
                return blockEvent(e);
            }

        }, true);

        const threshold = 160;

        setInterval(function() {

            if (!frame) return;

            const widthDiff =
                window.outerWidth - window.innerWidth;

            const heightDiff =
                window.outerHeight - window.innerHeight;

            if (
                widthDiff > threshold ||
                heightDiff > threshold
            ) {
                frame.style.display = "none";
            } else {
                frame.style.display = "block";
            }

        }, 1000);

    }

})();
</script>

</body>
</html>
