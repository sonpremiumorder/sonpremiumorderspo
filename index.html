<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <meta name="description" content="SƠN PREMIUM ORDER - Tra cứu và quản lý đơn hàng">
    <title>SƠN PREMIUM ORDER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #app-frame {
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: 0;
            background: #f5f5f5;
        }

        /* Dự phòng cho trình duyệt chưa hỗ trợ dvh */
        @supports not (height: 100dvh) {
            #app-frame {
                height: 100vh;
            }
        }

        /* Giữ cỡ chữ đủ lớn để tránh iOS tự phóng to khi nhập liệu */
        @media (hover: none) and (pointer: coarse) {
            input,
            textarea,
            select,
            button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <iframe
        id="app-frame"
        title="SƠN PREMIUM ORDER"
        src="https://script.google.com/macros/s/AKfycbyEWl8KF2ITtrmn5c80_QH8tSh1_sAQRueUjfMOyQYSnoVEJnQgoAX0MDtdXo11Qzrkfw/exec"
        allow="camera; microphone; geolocation"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
</body>
</html>
